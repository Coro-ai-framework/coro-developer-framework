name: Bug report
description: Something is broken or behaves incorrectly
title: "[bug]: "
labels: ["bug", "needs-repro"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please search existing issues first.
        For security issues, see [SECURITY.md](../../SECURITY.md) — do not file here.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: What did you expect vs what actually happened?
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Commands, config snippets, or a minimal repro repo
      placeholder: |
        1. pnpm install && pnpm build
        2. coro start
        3. ...
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Coro version / commit
      placeholder: e.g. main @ abc1234 or v0.1.0
    validations:
      required: true

  - type: dropdown
    id: mode
    attributes:
      label: Runtime mode
      options:
        - Local (solo / SQLite)
        - Hybrid (cloud-connected runner)
        - Coro Cloud (hosted control plane)
        - Not sure
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: OS, Node version, pnpm version
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Redact tokens and secrets

  - type: checkboxes
    id: terms
    attributes:
      label: Checklist
      options:
        - label: I have removed secrets from logs and attachments
          required: true
