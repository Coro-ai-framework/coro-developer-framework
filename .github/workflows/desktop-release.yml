name: Desktop Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Desktop app version to publish
        required: true
        type: string
      release_type:
        description: Release visibility in the public releases repository
        required: true
        default: release
        type: choice
        options:
          - release
          - prerelease
          - draft

concurrency:
  group: desktop-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish-macos:
    name: Publish macOS desktop release
    runs-on: macos-14-xlarge
    timeout-minutes: 60
    env:
      CI: true
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_TYPE: ${{ inputs.release_type }}
      PUBLIC_RELEASE_REPO: emreertugrul/coro-release
      PUBLIC_RELEASE_DEFAULT_BRANCH: main
      GITHUB_RELEASE_TOKEN: ${{ secrets.CORO_RELEASE_GITHUB_TOKEN }}
      GH_TOKEN: ${{ secrets.CORO_RELEASE_GITHUB_TOKEN }}
    steps:
      - name: Ensure release token is configured
        run: |
          if [[ -z "${GITHUB_RELEASE_TOKEN}" ]]; then
            echo "::error::Repository secret CORO_RELEASE_GITHUB_TOKEN is required to publish to ${PUBLIC_RELEASE_REPO}."
            exit 1
          fi

      - name: Bootstrap public release repository if empty
        run: |
          set -euo pipefail

          gh api "repos/${PUBLIC_RELEASE_REPO}" >/dev/null

          remote_url="https://github.com/${PUBLIC_RELEASE_REPO}.git"

          set +e
          git ls-remote --exit-code --heads "$remote_url" >/dev/null 2>&1
          ls_remote_status=$?
          set -e

          case "$ls_remote_status" in
            0)
              echo "PUBLIC_RELEASE_BOOTSTRAPPED=false" >> "$GITHUB_ENV"
              echo "Public release repo already has a branch."
              exit 0
              ;;
            2)
              echo "Bootstrapping empty public release repo ${PUBLIC_RELEASE_REPO}."
              ;;
            *)
              echo "::error::Unable to inspect ${PUBLIC_RELEASE_REPO}; git ls-remote exited with status ${ls_remote_status}."
              exit "$ls_remote_status"
              ;;
          esac

          bootstrap_dir="$RUNNER_TEMP/public-release-bootstrap"
          rm -rf "$bootstrap_dir"
          mkdir -p "$bootstrap_dir"
          cd "$bootstrap_dir"

          git init -b "$PUBLIC_RELEASE_DEFAULT_BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          cat > README.md <<EOF
          # Coro Desktop Releases

          This repository is the public distribution channel for signed Coro desktop builds.

          Source repository: https://github.com/${GITHUB_REPOSITORY}
          Release workflow: https://github.com/${GITHUB_REPOSITORY}/actions/workflows/desktop-release.yml
          EOF

          git add README.md
          git commit -m "Initialize public desktop release repository"
          git remote add origin "https://x-access-token:${GITHUB_RELEASE_TOKEN}@github.com/${PUBLIC_RELEASE_REPO}.git"
          git push origin "HEAD:${PUBLIC_RELEASE_DEFAULT_BRANCH}"
          git ls-remote --exit-code --heads "$remote_url" "refs/heads/${PUBLIC_RELEASE_DEFAULT_BRANCH}" >/dev/null

          echo "PUBLIC_RELEASE_BOOTSTRAPPED=true" >> "$GITHUB_ENV"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate requested version
        run: |
          node <<'NODE'
          const version = process.env.RELEASE_VERSION ?? ''
          const semver = /^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$/
          if (!semver.test(version)) {
            console.error(`Invalid version: ${version}`)
            process.exit(1)
          }
          NODE
          echo "DESKTOP_VERSION=${RELEASE_VERSION}" >> "$GITHUB_ENV"
          echo "DESKTOP_RELEASE_TAG=v${RELEASE_VERSION}" >> "$GITHUB_ENV"

      - name: Apply desktop version for this build
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const file = 'packages/desktop-electron/package.json'
          const pkg = JSON.parse(fs.readFileSync(file, 'utf8'))
          pkg.version = process.env.RELEASE_VERSION
          fs.writeFileSync(file, `${JSON.stringify(pkg, null, 2)}\n`)
          NODE

      - name: Configure release type
        run: |
          case "$RELEASE_TYPE" in
            release)
              echo 'EP_DRAFT=false' >> "$GITHUB_ENV"
              echo 'EP_PRE_RELEASE=false' >> "$GITHUB_ENV"
              ;;
            prerelease)
              echo 'EP_DRAFT=false' >> "$GITHUB_ENV"
              echo 'EP_PRE_RELEASE=true' >> "$GITHUB_ENV"
              ;;
            draft)
              echo 'EP_DRAFT=true' >> "$GITHUB_ENV"
              echo 'EP_PRE_RELEASE=false' >> "$GITHUB_ENV"
              ;;
            *)
              echo "::error::Unsupported release_type: $RELEASE_TYPE"
              exit 1
              ;;
          esac

      - name: Typecheck desktop package
        run: pnpm --filter @coro/desktop-electron typecheck

      - name: Prepare Apple signing and notarization inputs
        env:
          APPLE_SIGNING_CERT_B64: ${{ secrets.APPLE_SIGNING_CERT_B64 }}
          APPLE_SIGNING_CERT_PASSWORD: ${{ secrets.APPLE_SIGNING_CERT_PASSWORD }}
          APPLE_API_KEY_B64: ${{ secrets.APPLE_API_KEY_B64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail

          for name in APPLE_SIGNING_CERT_B64 APPLE_SIGNING_CERT_PASSWORD APPLE_API_KEY_B64 APPLE_API_KEY_ID APPLE_API_ISSUER; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing required secret: $name"
              exit 1
            fi
          done

          cert_path="$RUNNER_TEMP/apple-signing-cert.p12"
          api_key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"

          CERT_PATH="$cert_path" API_KEY_PATH="$api_key_path" node <<'NODE'
          const fs = require('node:fs')
          fs.writeFileSync(process.env.CERT_PATH, Buffer.from(process.env.APPLE_SIGNING_CERT_B64, 'base64'))
          fs.writeFileSync(process.env.API_KEY_PATH, Buffer.from(process.env.APPLE_API_KEY_B64, 'base64'))
          NODE

          chmod 600 "$cert_path" "$api_key_path"

          password_delimiter="$(uuidgen)"
          {
            echo "CSC_LINK=file://$cert_path"
            echo "CSC_KEY_PASSWORD<<$password_delimiter"
            printf '%s\n' "$APPLE_SIGNING_CERT_PASSWORD"
            echo "$password_delimiter"
            echo "APPLE_API_KEY=$api_key_path"
            echo "APPLE_API_KEY_ID=$APPLE_API_KEY_ID"
            echo "APPLE_API_ISSUER=$APPLE_API_ISSUER"
          } >> "$GITHUB_ENV"

      - name: Publish macOS release artifacts
        run: pnpm --filter @coro/desktop-electron release:mac

      - name: Capture public release metadata
        run: |
          set -euo pipefail
          gh release view "$DESKTOP_RELEASE_TAG" --repo "$PUBLIC_RELEASE_REPO" --json url,isDraft,isPrerelease,tagName > "$RUNNER_TEMP/public-release.json"
          release_url="$(gh release view "$DESKTOP_RELEASE_TAG" --repo "$PUBLIC_RELEASE_REPO" --json url --jq .url)"
          echo "PUBLIC_RELEASE_URL=${release_url}" >> "$GITHUB_ENV"

      - name: Attach provenance asset
        run: |
          set -euo pipefail
          provenance_path="$RUNNER_TEMP/coro-desktop-provenance.json"
          cat > "$provenance_path" <<EOF
          {
            "desktopVersion": "${DESKTOP_VERSION}",
            "releaseType": "${RELEASE_TYPE}",
            "publicReleaseRepository": "${PUBLIC_RELEASE_REPO}",
            "publicReleaseTag": "${DESKTOP_RELEASE_TAG}",
            "publicReleaseUrl": "${PUBLIC_RELEASE_URL}",
            "sourceRepository": "${GITHUB_REPOSITORY}",
            "sourceRef": "${GITHUB_REF}",
            "sourceSha": "${GITHUB_SHA}",
            "workflow": "${GITHUB_WORKFLOW}",
            "runId": "${GITHUB_RUN_ID}",
            "runAttempt": "${GITHUB_RUN_ATTEMPT}",
            "runUrl": "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          }
          EOF
          gh release upload "$DESKTOP_RELEASE_TAG" "$provenance_path" --repo "$PUBLIC_RELEASE_REPO" --clobber

      - name: Upload release outputs
        uses: actions/upload-artifact@v4
        with:
          name: desktop-release-${{ env.DESKTOP_VERSION }}
          retention-days: 30
          path: |
            packages/desktop-electron/release/Coro-${{ env.DESKTOP_VERSION }}-arm64.dmg
            packages/desktop-electron/release/Coro-${{ env.DESKTOP_VERSION }}-arm64.zip
            packages/desktop-electron/release/*.blockmap
            packages/desktop-electron/release/*.yml
            packages/desktop-electron/release/builder-effective-config.yaml
            ${{ runner.temp }}/public-release.json
            ${{ runner.temp }}/coro-desktop-provenance.json

      - name: Write workflow summary
        run: |
          {
            echo '## Desktop release published'
            echo
            echo "- Version: ${DESKTOP_VERSION}"
            echo "- Release type: ${RELEASE_TYPE}"
            echo "- Public release repo bootstrapped: ${PUBLIC_RELEASE_BOOTSTRAPPED:-false}"
            echo "- Public release: ${PUBLIC_RELEASE_URL}"
            echo "- Source commit: ${GITHUB_SHA}"
          } >> "$GITHUB_STEP_SUMMARY"