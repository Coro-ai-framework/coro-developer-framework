name: Desktop Validation

on:
  pull_request:
    paths:
      - '.github/workflows/desktop-validation.yml'
      - '.github/workflows/desktop-release.yml'
      - 'packages/desktop-electron/**'
      - 'packages/cloud-protocol/**'
      - 'packages/dashboard/**'
      - 'packages/runner/**'
      - 'packages/intelligence-base/**'
      - 'packages/plugin-*/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.base.json'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/desktop-validation.yml'
      - '.github/workflows/desktop-release.yml'
      - 'packages/desktop-electron/**'
      - 'packages/cloud-protocol/**'
      - 'packages/dashboard/**'
      - 'packages/runner/**'
      - 'packages/intelligence-base/**'
      - 'packages/plugin-*/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.base.json'
  merge_group:
    types:
      - checks_requested
  workflow_dispatch:

concurrency:
  group: desktop-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  package-macos:
    name: Package macOS desktop shell
    runs-on: macos-14-xlarge
    timeout-minutes: 45
    env:
      CI: true
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Capture desktop version
        run: |
          echo "DESKTOP_VERSION=$(node -p 'require("./packages/desktop-electron/package.json").version')" >> "$GITHUB_ENV"

      - name: Typecheck desktop package
        run: pnpm --filter @coro-ai/desktop-electron typecheck

      - name: Build release artifacts without publishing
        run: pnpm --filter @coro-ai/desktop-electron dist:mac

      - name: Verify packaged artifacts exist
        run: |
          set -euo pipefail
          test -f "packages/desktop-electron/release/Coro-${DESKTOP_VERSION}-arm64.dmg"
          test -f "packages/desktop-electron/release/Coro-${DESKTOP_VERSION}-arm64.zip"
          test -d "packages/desktop-electron/release/mac-arm64/Coro.app"

      - name: Upload packaged artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-macos-${{ env.DESKTOP_VERSION }}
          retention-days: 14
          path: |
            packages/desktop-electron/release/Coro-${{ env.DESKTOP_VERSION }}-arm64.dmg
            packages/desktop-electron/release/Coro-${{ env.DESKTOP_VERSION }}-arm64.zip
            packages/desktop-electron/release/*.blockmap
            packages/desktop-electron/release/builder-effective-config.yaml

  package-windows:
    name: Package Windows desktop shell
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      CI: true
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Capture desktop version
        run: |
          echo "DESKTOP_VERSION=$(node -p 'require("./packages/desktop-electron/package.json").version')" >> "$GITHUB_ENV"

      - name: Typecheck desktop package
        run: pnpm --filter @coro-ai/desktop-electron typecheck

      - name: Build Windows release artifacts without publishing
        run: pnpm --filter @coro-ai/desktop-electron dist:win

      - name: Verify packaged artifacts exist
        run: |
          set -euo pipefail
          test -f "packages/desktop-electron/release/Coro-${DESKTOP_VERSION}-x64.exe"
          test -d "packages/desktop-electron/release/win-unpacked"

      - name: Upload packaged artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows-${{ env.DESKTOP_VERSION }}
          retention-days: 14
          path: |
            packages/desktop-electron/release/Coro-${{ env.DESKTOP_VERSION }}-x64.exe
            packages/desktop-electron/release/*.blockmap
            packages/desktop-electron/release/*.yml
            packages/desktop-electron/release/builder-effective-config.yaml
