name: NPM Publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semver to publish for all @coro-ai/* packages
        required: true
        type: string
      dry_run:
        description: Build and pack only — do not publish to npm
        required: false
        default: true
        type: boolean
  push:
    tags:
      - "npm/v*.*.*"

concurrency:
  group: npm-publish
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  prepare:
    name: Build and stage runner tarball
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      publish_version: ${{ steps.resolve_version.outputs.publish_version }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve release version
        id: resolve_version
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF_NAME#npm/v}"
          fi
          export VERSION="$version"
          node <<'NODE'
          const semver = /^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$/
          const version = process.env.VERSION
          if (!semver.test(version)) {
            console.error(`Invalid semver: ${version}`)
            process.exit(1)
          }
          console.log(`Resolved publish version: ${version}`)
          NODE
          echo "PUBLISH_VERSION=$version" >> "$GITHUB_ENV"
          echo "publish_version=$version" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply publish version to workspace packages
        run: node scripts/set-publish-versions.mjs "$PUBLISH_VERSION"

      - name: Build publishable packages
        run: pnpm run build:publishable

      - name: Run pre-publish tests
        run: |
          pnpm --filter @coro-ai/runner test
          pnpm --filter @coro-ai/plugin-sdk test

      - name: Verify npm pack tarballs
        run: pnpm run verify:npm-pack

      - name: Stage runner for npm publish
        run: node scripts/prepare-runner-npm-publish.mjs

      - name: Verify staged runner tree
        run: |
          set -euo pipefail
          test -f packages/runner/.npm-publish/package.json
          test -d packages/runner/.npm-publish/node_modules
          test -f packages/runner/.npm-publish/scripts/install-platform-native-deps.mjs

      # upload-artifact@v4 skips .gitignore'd paths (packages/runner/.npm-publish/).
      # Copy to a non-ignored directory before upload.
      - name: Copy staged runner for artifact upload
        run: |
          set -euo pipefail
          rm -rf artifacts/runner-npm-staging
          mkdir -p artifacts
          cp -a packages/runner/.npm-publish artifacts/runner-npm-staging

      - name: Upload staged runner artifact
        uses: actions/upload-artifact@v4
        with:
          name: runner-npm-publish-${{ steps.resolve_version.outputs.publish_version }}
          retention-days: 7
          path: artifacts/runner-npm-staging/
          if-no-files-found: error

  verify-global-install:
    name: Verify global install (${{ matrix.os }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        # Match desktop-release / desktop-validation: windows-latest ships VS 2026
        # (node-gyp 10 cannot detect it), which breaks better-sqlite3 compile fallback.
        os: [windows-2022, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Download staged runner artifact
        uses: actions/download-artifact@v4
        with:
          name: runner-npm-publish-${{ needs.prepare.outputs.publish_version }}
          path: artifacts/runner-npm-staging

      - name: Install staged runner into verify path
        shell: bash
        run: |
          set -euo pipefail
          rm -rf packages/runner/.npm-publish
          mkdir -p packages/runner
          cp -a artifacts/runner-npm-staging packages/runner/.npm-publish
          test -f packages/runner/.npm-publish/package.json

      - name: Verify Claude CLI resolves after global install
        run: node scripts/verify-runner-global-install.mjs

  publish:
    name: Publish @coro-ai packages
    needs: [prepare, verify-global-install]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NPM_CONFIG_PROVENANCE: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Resolve release version
        run: echo "PUBLISH_VERSION=${{ needs.prepare.outputs.publish_version }}" >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply publish version to workspace packages
        run: node scripts/set-publish-versions.mjs "$PUBLISH_VERSION"

      - name: Build publishable packages
        run: pnpm run build:publishable

      - name: Download staged runner artifact
        uses: actions/download-artifact@v4
        with:
          name: runner-npm-publish-${{ needs.prepare.outputs.publish_version }}
          path: artifacts/runner-npm-staging

      - name: Install staged runner into publish path
        run: |
          set -euo pipefail
          rm -rf packages/runner/.npm-publish
          mkdir -p packages/runner
          cp -a artifacts/runner-npm-staging packages/runner/.npm-publish
          test -f packages/runner/.npm-publish/package.json

      - name: Verify npm credentials
        if: github.event_name == 'push' || inputs.dry_run == false
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${NODE_AUTH_TOKEN:-}" ]]; then
            echo "::error::Repository secret NPM_TOKEN is required to publish."
            exit 1
          fi
          echo "npm whoami: $(npm whoami)"
          npm access list packages @coro-ai || true

      - name: Publish to npm
        if: github.event_name == 'push' || inputs.dry_run == false
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          pnpm -r publish --access public --no-git-checks --provenance \
            --filter @coro-ai/llm-anthropic \
            --filter @coro-ai/llm-openai \
            --filter @coro-ai/plugin-sdk \
            --filter @coro-ai/plugin-gitlab
          npm publish --access public --provenance packages/runner/.npm-publish

      - name: Dry run summary
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run == true
        run: |
          {
            echo '## NPM publish dry run'
            echo
            echo "- Version: \`${PUBLISH_VERSION}\`"
            echo "- Built and packed all packages in \`scripts/publish-packages.json\`"
            echo "- Verified global install on Windows and macOS"
            echo "- Re-run with **dry_run: false** or push tag \`npm/v${PUBLISH_VERSION}\` to publish"
            echo
            echo 'After publish, install with:'
            echo '```bash'
            echo "npm install -g @coro-ai/runner@${PUBLISH_VERSION}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
