name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
    types: [checks_requested]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build publishable packages and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build npm publishable packages
        run: pnpm run build:publishable

      - name: Typecheck runner
        run: pnpm --filter @coro-ai/runner typecheck

      - name: Run runner unit tests
        run: pnpm --filter @coro-ai/runner test

      - name: Run plugin-sdk tests
        run: pnpm --filter @coro-ai/plugin-sdk test

      - name: Verify npm pack tarballs
        run: pnpm run verify:npm-pack

      - name: Upload pack artifacts
        uses: actions/upload-artifact@v4
        with:
          name: npm-pack-verify
          retention-days: 7
          path: .npm-pack-verify/*.tgz
