name: Coro review
description: Review a pull request with Coro. One round per event. State lives in a sticky comment. Head code is never executed and head intelligence is never loaded, which is why pull_request_target is acceptable.

inputs:
  pr:
    description: Pull request URL. Defaults to the event's pull request.
    required: false
  provider:
    description: Executor plugin id. The first provider with credentials is used when this is empty.
    required: false
  fail-on:
    description: Exit non-zero when an open finding reaches this severity. Only "blocker" is supported.
    required: false
  coro-config:
    description: JSON config matching ~/.coro/config.json. Tokens come from secrets.
    required: false

runs:
  using: composite
  steps:
    - name: Write config
      if: inputs.coro-config != ''
      shell: bash
      run: |
        mkdir -p "$HOME/.coro"
        printf '%s\n' "$CORO_CONFIG" > "$HOME/.coro/config.json"
      env:
        CORO_CONFIG: ${{ inputs.coro-config }}
    - name: Review
      shell: bash
      env:
        CORO_REVIEW_PR: ${{ inputs.pr }}
        CORO_REVIEW_FAIL: ${{ inputs.fail-on }}
      run: |
        args=(review run --once --pr "${CORO_REVIEW_PR:-$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/pull/${{ github.event.pull_request.number }}}")
        if [ -n "$CORO_REVIEW_FAIL" ]; then args+=(--fail-on "$CORO_REVIEW_FAIL"); fi
        npx -y @coro-ai/runner "${args[@]}"
