# Local development override — automatically loaded by `docker compose`.
#
# Removes the coro-runner service from the compose stack so you can run it
# directly with `pnpm dev:runner` (ts-node + nodemon) for instant hot-reload.
# ngrok tunnels to host.docker.internal:3000 (the locally running runner).
#
# Usage:
#   docker compose up         # starts Redis + ngrok only
#   pnpm dev:runner           # starts the runner with hot-reload
#
# To test the full Docker build:
#   docker compose --file docker-compose.yml up --build

services:
  coro-runner:
    profiles:
      - docker   # only included when: docker compose --profile docker up
