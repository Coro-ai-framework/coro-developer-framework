services:

  coro-runner:
    build:
      # Build context is the workspace root so the Dockerfile can pull in the
      # pnpm lockfile + the dashboard package alongside the runner.
      context: ../..
      dockerfile: packages/runner/Dockerfile
      target: production
    ports:
      - "3000:3000"
    volumes:
      # Settings file — copy from settings.example.json and fill in your values
      - ./config/settings.json:/app/config/settings.json:ro
      # Shared data volume: working/{job-id}/ state + intelligence repo checkout
      - ./data:/data
    env_file:
      - .env
    environment:
      NODE_ENV: production
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  ngrok:
    image: ngrok/ngrok:latest
    command: http host.docker.internal:3000 --log=stdout
    ports:
      - "4040:4040"
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
    restart: unless-stopped

volumes:
  redis-data:
    driver: local
